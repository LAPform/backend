services:
  - type: web
    name: formforge-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    plan: starter
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: formforge-db
          property: connectionString
      - key: PYTHONPATH
        value: .

  - type: pserv
    name: formforge-db
    env: postgresql
    plan: starter
    region: oregon
